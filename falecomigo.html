<doctype html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Comigo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">  
                <div class="text-center mb-4">
                    <h1 class="fw-bold">Fale Comigo Xaulin Do Golito</h1>
                    <p class="text-muted">Preencha os campos abaixo para me enviar uma mensagem.</p>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form action="#" method="POST">
                            
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-bold">Nome Completo</label>
                                <input type="text" class="form-control bg-light border-0" id="nome" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">E-mail</label>
                                <input type="email" class="form-control bg-light border-0" id="email" placeholder="seu@email.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="mensagem" class="form-label fw-bold">Sua Mensagem</label>
                                <textarea class="form-control bg-light border-0" id="mensagem" rows="5" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark btn-lg">Enviar Mensagem</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
